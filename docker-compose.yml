########################################
# UHF Server — base compose file
#
# Runs the pre-built image (UHF Server + FFmpeg + Comskip) from GitHub
# Container Registry. Optional overlays:
#
#   VPN via gluetun (any provider):
#     docker compose -f docker-compose.yml -f docker-compose.vpn.yml up -d
#
#   Host ffmpeg/Comskip instead of the built-in ones (x86-64 only):
#     docker compose -f docker-compose.yml -f docker-compose.host-ffmpeg.yml up -d
#
# Or set COMPOSE_FILE in .env to combine overlays automatically.
########################################

services:
  uhf-server:
    image: ${IMAGE_REGISTRY:-ghcr.io/rydizz214/uhf-server-docker}:${IMAGE_TAG:-2.2.0}
    container_name: uhf-server
    init: true
    restart: unless-stopped
    env_file:
    - .env
    ports:
    - ${HOST_PORT:-8000}:${UHF_PORT:-8000}
    volumes:
    - ${HOST_RECORDINGS_DIR:-./uhf-recordings}:/recordings
    - ${HOST_UHF_DATA_DIR:-./uhf-data}:/var/lib/uhf-server
    # Optional: let systemd-inhibit keep the host awake during recordings.
    # - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
    environment:
      TZ: ${TZ:-America/New_York}
      UHF_PORT: ${UHF_PORT:-8000}
      UHF_RECORDINGS_DIR: ${UHF_RECORDINGS_DIR:-/recordings}
      UHF_DATA_DIR: ${UHF_DATA_DIR:-/var/lib/uhf-server}
      UHF_ENABLE_COMMERCIAL_DETECTION: ${UHF_ENABLE_COMMERCIAL_DETECTION:-true}
      UHF_SINGLE_FILE_RECORDINGS: ${UHF_SINGLE_FILE_RECORDINGS:-}
      COMSKIP_ARGS: ${COMSKIP_ARGS:---ini}
      LOG_LEVEL: ${LOG_LEVEL:-info}
